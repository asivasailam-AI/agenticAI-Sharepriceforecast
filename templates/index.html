</head>
<body>

<div class="container container--form">

    <p class="eyebrow">Share Price Forecasting</p>

    <h1>Share price Forecasting Using  Multi Agents AI</h1>
    <p class="subtitle">Get a data-driven stock price forecast in just a few seconds.</p>

    <form action="/predict" method="POST">

        <label>Stock Symbol</label>

        <input
          type="text"
          name="symbol"
          placeholder="RELIANCE"
          required>

        <label>Forecast Days</label>

        <input
          type="number"
          name="forecast_days"
          value="5"
          min="1"
          max="30"
          required>

        <button type="submit">
            Predict Stock Price
        </button>

    </form>

</div>
